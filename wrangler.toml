name = "wasboutiqueworker"
main = "index.js"
compatibility_date = "2024-11-20"

[vars]
SQUARE_LOCATION_ID = "39W8YZBSN93ZN"
ALLOWED_ORIGIN = "https://wasboutique-shop.pages.dev"
SITE_URL = "https://wasboutique-shop.pages.dev"
CATALOG_CACHE_TTL = "300"

# ── Shipping / tax (see index.js header for semantics) ─────────
# SHIPPING_FREE_OVER_CENTS: free US shipping at/above this subtotal (0 disables)
SHIPPING_FLAT_CENTS = "695"
SHIPPING_FREE_OVER_CENTS = "7500"
SHIPPING_INTL_FLAT_CENTS = "1995"
# TAX_RATES: JSON map of 2-letter state -> percent.
# TEXAS ENABLED 2026-09-20: client (Angela, WAS Boutique) is a Houston TX business
# with physical presence in Texas, so TX sales tax is collected. Every other state
# stays $0 until she confirms more registrations — do not invent rates.
TAX_RATES = "{\"TX\": 8.25}"
# TAX_SHIPPING: Texas treats delivery charges as part of the taxable sales price.
TAX_SHIPPING = "true"
